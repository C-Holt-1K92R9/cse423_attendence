<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <!-- We're using Tailwind CSS for styling to make our page look nice without writing custom CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="absolute top-6 right-8">
        <button type="button"
            id="logoutButton"
            class="flex items-center gap-2 bg-white border border-red-500 text-red-600 hover:bg-red-50 hover:text-red-700 font-semibold py-2 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-300 transition-colors duration-200"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
            </svg>
            Log Out
        </button>
        <script>
            const logoutButton = document.getElementById('logoutButton');
            logoutButton.addEventListener('click', () => {
            // Redirect to logout endpoint or home page
            window.location.href = '/api/logout';
            });
        </script>
    </div>
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="flex flex-col items-center mb-2">
            <img id="profilePhoto" src="" alt="Profile Photo" class="w-20 h-20 rounded-full mb-2 border-2 border-gray-300 object-cover" referrerpolicy="no-referrer">
    
    <script>
        // This script should run after the profilePhoto element has loaded
        document.addEventListener('DOMContentLoaded', function() {
            
            // 2. Use a more robust function to get and decode the cookie
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        // This decodes the URL, fixing issues with special characters
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return null;
            }

            const photoUrl = getCookie('photo_url');
            const imgElement = document.getElementById('profilePhoto');

            if (photoUrl) {
                // Set the src attribute with the correctly decoded URL
                imgElement.src = photoUrl;
            } else {
                // Optional: set a default placeholder image if the cookie isn't found
                imgElement.src = 'https://placehold.co/80x80/EFEFEF/333333?text=User';
            }
        });
    </script>
            <h1 id="welcomeHeader" class="text-2xl font-bold text-center text-gray-800">Welcome!</h1>
        </div>
        <script>
            // Function to get a cookie value by name
            function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            }
            // Get the 'name' cookie and update the welcome header if present
            const studentName = getCookie('name');
            if (studentName) {
            // Array of random greetings
            const greetings = [
                "Welcome",
                "Hello",
                "Hi",
                "Greetings",
                "Glad to see you",
                "Nice to have you",
                "Hey there",
                "Good to see you",
                "Welcome back",
                "Howdy",
                "You made it!",
                "Ready to learn?",
                "Attendance superstar!",
                "Look who's here!",
                "Rockstar in the house!",
                "Let's make today awesome!",
                "High five for showing up!",
                "You brighten the classroom!",
                "Keep up the great work!",
                "Let's crush this day!"
            ];
            // Pick a random greeting
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            document.getElementById('welcomeHeader').textContent = `${randomGreeting}, ${studentName}!`;
            }
        </script>
        <p class="text-center text-gray-500 mb-6">Kindly submit your attendance before your faculty closes the QR code. Thank you!</p>
        
        <form id="attendanceForm">   
            <div class="flex items-center justify-center">
                <button 
                    type="submit" 
                    id="submitButton"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200"
                >
                    Submit Attendance for
                    <span class="block text-xs font-semibold text-white mt-1" id="currentDate"></span>
                    <script>
                        // Display the current date in a readable format
                        document.addEventListener('DOMContentLoaded', function() {
                            const dateSpan = document.getElementById('currentDate');
                            const now = new Date();
                            // Format: Month Day, Year (e.g., June 7, 2024)
                            const options = { year: 'numeric', month: 'long', day: 'numeric' };
                            dateSpan.textContent = now.toLocaleDateString(undefined, options);
                        });
                    </script>
                </button>
            </div>
        </form>

        <!-- This area will show success or error messages from the server -->
        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <!-- This script handles sending the form data to your Node.js server -->
    <script>
         
        
        // Get references to the HTML elements we'll be working with.
        const form = document.getElementById('attendanceForm');
        const messageArea = document.getElementById('messageArea');
        const submitButton = document.getElementById('submitButton');

        // Listen for the form's 'submit' event.
        form.addEventListener('submit', async (event) => {
            // 1. Prevent the form from doing its default behavior (reloading the page).
            event.preventDefault();
            // Get the query parameters from the current URL
            // Get the value of the 'token' cookie, or default to an empty string if it's not there.
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
                return '';
            }
           const token = getCookie('token') || '';
           const studentId = getCookie('student_id');
            if (!token) {
                submitButton.disabled = true;
                submitButton.classList.add('bg-gray-400', 'cursor-not-allowed');
                submitButton.classList.remove('bg-blue-500', 'hover:bg-blue-700');
                messageArea.textContent = 'Authentication token missing. Please log in again.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
                return;
            }
            // 2. Get the value from the input field.
            // Try to get studentId from cookie, then from URL query parameter as fallback
            
            confirmation = confirm("Are you sure you want to submit your attendance for "+studentId+" ?");

            // 3. Disable the button to prevent multiple submissions while waiting for a response.
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            messageArea.textContent = ''; // Clear any previous messages

            try {
                // 4. Send the data to your server's backend endpoint using the Fetch API.
                const response = await fetch(`/api/attend`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Tell the server we're sending JSON
                    },
                    body: JSON.stringify({ studentId, token }) // Convert our data to a JSON string
                });

                // 5. Get the JSON response from the server.
                const result = await response.json();

                // 6. Display the server's message to the user.
                if (response.ok) { // Check if the request was successful (status 200-299)
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-green-600';
                    form.reset(); // Clear the form input field on success
                } else {
                    messageArea.textContent = result.message || 'An unknown error occurred.';
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }

            } catch (error) {
                // This catches network errors or issues with the fetch call itself.
                console.error('Fetch error:', error);
                messageArea.textContent = 'Could not connect to the server. Please check your connection.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            } finally {
                // 7. Re-enable the button whether the request succeeded or failed.
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Attendance';
            }
        });
    </script>

</body>
</html>
