<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="absolute top-6 right-8">
        <button type="button"
            id="homeButton"
            class="flex items-center gap-2 bg-white border border-blue-500 text-blue-600 hover:bg-blue-50 hover:text-blue-700 font-semibold py-2 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors duration-200"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0h6" />
            </svg>
            Back to Home
        </button>
    </div>

    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h1>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">email</label>
                <input type="text" id="email" name="email" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. something@your.domain" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password here" required>
            </div>
            <label class="flex items-center mb-4 w-full cursor-pointer select-none">
                <input type="checkbox" id="rememberMe" name="rememberMe" class="form-checkbox h-5 w-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                <span class="ml-2 text-gray-700 text-sm">Remember me</span>
            </label>
            <div class="flex items-center justify-center">
            
                <button type="submit" id="loginButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                    Sign In
                </button>
            </div>
        </form>

        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        const facultyLoginButton = document.getElementById('homeButton');
            facultyLoginButton.addEventListener('click', () => {
                // Redirect to the faculty login page when the button is clicked
                window.location.href = '/';
            });

        const form = document.getElementById('loginForm');
        const messageArea = document.getElementById('messageArea');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const rememberMe = form.rememberMe.checked ? true : false;
            const email = form.email.value;
            const password = form.password.value;
            messageArea.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });

                const result = await response.json();

                if (response.ok) {
                    messageArea.textContent =result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-green-600';
                    // Redirect to the admin dashboard after successful login
                    window.location.href = '/admin/dashboard';
                } else {
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }
            } catch (error) {
                messageArea.textContent = 'Could not connect to the server.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            }
        });
    </script>
</body>
</html>
