<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="flex flex-col items-center mb-2">
            <svg class="h-8 w-8 text-red-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="white"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01" />
            </svg>
            <h1 id="welcomeHeader" class="text-2xl font-bold text-center text-gray-800">Before We Start!</h1>
        </div>
        <p class="text-center text-gray-500 mb-6">Please Submit your Student ID.</p>
        <p><b><span style="color:red">Note:</span></b> Once you enter your student ID, you'll <b><span style="color:red">NOT</span></b> be able to change it again!</p>
        <form id="attendanceForm">
            <div class="mb-4">
                <label for="studentId" class="block text-gray-700 text-sm font-bold mb-2 mt-4">Student ID</label>
                <input 
                    type="text" 
                    id="studentId" 
                    name="studentId"
                    placeholder="e.g., 1012023"
                    class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>
            <div class="flex items-center justify-center">
                <button 
                    type="submit" 
                    id="submitButton"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200"
                >
                    Submit Student ID
                </button>
            </div>
        </form>
        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>
    <script>
        const form = document.getElementById('attendanceForm');
        const studentIdInput = document.getElementById('studentId');
        const messageArea = document.getElementById('messageArea');
        const submitButton = document.getElementById('submitButton');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token') || '';
            const studentId = studentIdInput.value.trim();

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            messageArea.textContent = '';
            messageArea.classList.remove('text-red-500', 'text-green-600');

            try {
                const response = await fetch('/api/submit_id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ studentId })
                });

                const result = await response.json();

                if (response.ok) {
                    messageArea.textContent = 'Student ID submitted successfully! Redirecting...';
                    messageArea.classList.add('text-green-600');
                    setTimeout(() => {
                        window.location.href = `/student?token=${encodeURIComponent(token)}`;
                    }, 2000);
                } else {
                    // Print the message sent from the server
                    messageArea.textContent = result.message || result.error || 'Submission failed. Please try again.';
                    messageArea.classList.add('text-red-500');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Student ID';
                }
            } catch (error) {
                messageArea.textContent = `Error: ${error.message}`;
                messageArea.classList.add('text-red-500');
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Student ID';
            }
        });
    </script>
</body>
</html>
