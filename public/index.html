<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        html, body {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign In to Your Account</h1>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" name="email" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. something@your.domain" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password here" required>
            </div>
            <label class="flex items-center mb-4 w-full cursor-pointer select-none">
                <input type="checkbox" id="rememberMe" name="rememberMe" class="form-checkbox h-5 w-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                <span class="ml-2 text-gray-700 text-sm">Remember me</span>
            </label>
            <div class="flex items-center justify-center">
                <button type="submit" id="loginButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                    Sign In
                </button>
            </div>
        </form>
    
        <div class="flex items-center justify-center my-4">
            <a href="/auth/google"
               class="flex items-center justify-center gap-2 w-full bg-white border border-gray-300 hover:bg-blue-50 text-gray-700 font-semibold py-3 px-4 rounded-lg shadow transition-colors duration-200"
               style="box-shadow: 0 1px 2px rgba(60,64,67,.15);"
            >
                <svg class="h-5 w-5" viewBox="0 0 48 48"><g><path fill="#4285F4" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.23l6.87-6.87C35.62 2.36 30.18 0 24 0 14.82 0 6.74 5.82 2.69 14.29l8.06 6.26C12.68 14.44 17.89 9.5 24 9.5z"/><path fill="#34A853" d="M46.1 24.55c0-1.64-.15-3.22-.43-4.74H24v9.01h12.41c-.54 2.9-2.18 5.36-4.65 7.01l7.19 5.59C43.98 37.13 46.1 31.32 46.1 24.55z"/><path fill="#FBBC05" d="M10.75 28.55a14.5 14.5 0 010-9.1l-8.06-6.26A23.97 23.97 0 000 24c0 3.77.9 7.34 2.69 10.45l8.06-6.26z"/><path fill="#EA4335" d="M24 48c6.18 0 11.36-2.04 15.15-5.54l-7.19-5.59c-2 1.34-4.56 2.13-7.96 2.13-6.11 0-11.32-4.94-13.25-11.55l-8.06 6.26C6.74 42.18 14.82 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></g></svg>
                <span>Continue with G-Suite</span>
            </a>
        </div>

        <div id="messageArea" class="mt-4 text-center font-medium"></div>

        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">Don't have an account? 
                <a href="/register" class="text-blue-500 hover:text-blue-700 font-semibold">Create one</a>
            </p>
        </div>
    </div>

    <script>
        // --- FIXED ---
        // The script block for the non-existent 'homeButton' has been removed.
        const urlparam = new URLSearchParams(window.location.search);
        const message = urlparam.get('message') || '';
        if (message!=''){
            const messageArea = document.getElementById('messageArea');
            messageArea.textContent = message;
            messageArea.className = 'mt-4 text-center font-medium text-red-600';
        }

        const form = document.getElementById('loginForm');
        const messageArea = document.getElementById('messageArea');

        form.addEventListener('submit', async (event) => {
            // This will now run correctly, preventing the default page reload.
            event.preventDefault();
            
            const rememberMe = form.rememberMe.checked;
            const email = form.email.value;
            const password = form.password.value;
            messageArea.textContent = '';

            try {
                // This POST request will now be sent to your server.
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });

                if (response.ok) {
                    const result = await response.json();
                    // Redirect based on user type returned from server
                    const redirectUrl = result.type === 0 ? '/student' : '/admin/dashboard';
                    window.location.href = redirectUrl;
                } else {
                    const result = await response.json();
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }
            } catch (error) {
                messageArea.textContent = 'Could not connect to the server.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            }
        });
    </script>
</body>
</html>
