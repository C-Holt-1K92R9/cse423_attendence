<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <!-- We're using Tailwind CSS for styling to make our page look nice without writing custom CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="absolute top-6 right-8">
        <button type="button"
            id="facultyLoginButton"
            class="flex items-center gap-2 bg-white border border-blue-500 text-blue-600 hover:bg-blue-50 hover:text-blue-700 font-semibold py-2 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors duration-200"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Faculty Login
        </button>
    </div>
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Welcome!</h1>
        <p class="text-center text-gray-500 mb-6">Please enter your Student ID to mark your attendance.</p>
        
        <form id="attendanceForm">
            <div class="mb-4">
                <label for="studentId" class="block text-gray-700 text-sm font-bold mb-2">Student ID</label>
                <input 
                    type="text" 
                    id="studentId" 
                    name="studentId"
                    placeholder="e.g., 1012023"
                    class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>
            
            <div class="flex items-center justify-center">
                <button 
                    type="submit" 
                    id="submitButton"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200"
                >
                    Submit Attendance
                </button>
            </div>
        </form>

        <!-- This area will show success or error messages from the server -->
        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <!-- This script handles sending the form data to your Node.js server -->
    <script>
        const facultyLoginButton = document.getElementById('facultyLoginButton');
        facultyLoginButton.addEventListener('click', () => {
            // Redirect to the faculty login page when the button is clicked
            window.location.href = '/login';
        });
        // Get references to the HTML elements we'll be working with.
        const form = document.getElementById('attendanceForm');
        const studentIdInput = document.getElementById('studentId');
        const messageArea = document.getElementById('messageArea');
        const submitButton = document.getElementById('submitButton');

        // Listen for the form's 'submit' event.
        form.addEventListener('submit', async (event) => {
            // 1. Prevent the form from doing its default behavior (reloading the page).
            event.preventDefault();

            // 2. Get the value from the input field.
            const studentId = studentIdInput.value;

            // 3. Disable the button to prevent multiple submissions while waiting for a response.
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            messageArea.textContent = ''; // Clear any previous messages

            try {
                // 4. Send the data to your server's backend endpoint using the Fetch API.
                const response = await fetch('/api/attend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Tell the server we're sending JSON
                    },
                    body: JSON.stringify({ studentId: studentId }) // Convert our data to a JSON string
                });

                // 5. Get the JSON response from the server.
                const result = await response.json();

                // 6. Display the server's message to the user.
                if (response.ok) { // Check if the request was successful (status 200-299)
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-green-600';
                    form.reset(); // Clear the form input field on success
                } else {
                    messageArea.textContent = result.message || 'An unknown error occurred.';
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }

            } catch (error) {
                // This catches network errors or issues with the fetch call itself.
                console.error('Fetch error:', error);
                messageArea.textContent = 'Could not connect to the server. Please check your connection.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            } finally {
                // 7. Re-enable the button whether the request succeeded or failed.
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Attendance';
            }
        });
    </script>

</body>
</html>
