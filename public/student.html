<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <!-- Logout Button -->
    <div class="absolute top-6 right-8">
        <button type="button"
            id="logoutButton"
            class="flex items-center gap-2 bg-white border border-red-500 text-red-600 hover:bg-red-50 hover:text-red-700 font-semibold py-2 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-300 transition-colors duration-200"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
            </svg>
            Log Out
        </button>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="flex flex-col items-center mb-2">
            <img id="profilePhoto" src="" alt="Profile Photo" class="w-20 h-20 rounded-full mb-2 border-2 border-gray-300 object-cover" referrerpolicy="no-referrer">
            <h1 id="welcomeHeader" class="text-2xl font-bold text-center text-gray-800">Welcome!</h1>
        </div>
        <p class="text-center text-gray-500 mb-6">Kindly submit your attendance before your faculty closes the QR code. Thank you!</p>
        
        <form id="attendanceForm">   
            <div class="flex items-center justify-center">
                <button 
                    type="submit" 
                    id="submitButton"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200"
                >
                    Submit Attendance for
                    <span class="block text-xs font-semibold text-white mt-1" id="currentDate"></span>
                </button>
            </div>
        </form>
        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        // Utility: Get cookie by name
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return null;
        }

        // Logout button handler
        document.getElementById('logoutButton').addEventListener('click', () => {
            window.location.href = '/api/logout';
        });

        // Set profile photo
        document.addEventListener('DOMContentLoaded', function() {
            const photoUrl = getCookie('photo_url');
            const imgElement = document.getElementById('profilePhoto');
            imgElement.src = photoUrl || 'https://placehold.co/80x80/EFEFEF/333333?text=User';
        });

        // Set welcome header with random greeting
        document.addEventListener('DOMContentLoaded', function() {
            const studentName = getCookie('name');
            if (studentName) {
                const greetings = [
                    "Welcome", "Hello", "Hi", "Greetings", "Glad to see you", "Nice to have you",
                    "Hey there", "Good to see you", "Welcome back", "Howdy", "You made it!",
                    "Ready to learn?", "Attendance superstar!", "Look who's here!", "Rockstar in the house!",
                    "Let's make today awesome!", "High five for showing up!", "You brighten the classroom!",
                    "Keep up the great work!", "Let's crush this day!"
                ];
                const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
                document.getElementById('welcomeHeader').textContent = `${randomGreeting}, ${studentName}!`;
            }
        });

        // Set current date
        document.addEventListener('DOMContentLoaded', function() {
            const dateSpan = document.getElementById('currentDate');
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            dateSpan.textContent = now.toLocaleDateString(undefined, options);
        });

        // Attendance form submission
        document.getElementById('attendanceForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const messageArea = document.getElementById('messageArea');
            const submitButton = document.getElementById('submitButton');
            const token = getCookie('token') || '';
            const studentId = getCookie('student_id');

            if (!token) {
                submitButton.disabled = true;
                submitButton.classList.add('bg-gray-400', 'cursor-not-allowed');
                submitButton.classList.remove('bg-blue-500', 'hover:bg-blue-700');
                messageArea.textContent = 'Authentication token missing. Please scan the qr code again.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
                return;
            }

            if (!confirm(`Are you sure you want to submit your attendance for ${studentId} ?`)) {
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            messageArea.textContent = '';

            try {
                const response = await fetch(`/api/attend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, token })
                });
                const result = await response.json();
                if (response.ok) {
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-green-600';
                } else {
                    messageArea.textContent = result.message || 'An unknown error occurred.';
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                messageArea.textContent = 'Could not connect to the server. Please check your connection.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Attendance';
            }
        });
    </script>
</body>
</html>
