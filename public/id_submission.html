<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <!-- We're using Tailwind CSS for styling to make our page look nice without writing custom CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="flex justify-center mb-2">
            <svg class="h-8 w-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="white"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01" />
            </svg>
        
        <h1 id="welcomeHeader" class="text-2xl font-bold text-center text-gray-800 mb-2">Before We Start!</h1></svg></div>
           
        <p class="text-center text-gray-500 mb-6">Please Submit your Student ID.</p>
        <p ><b><span style="color:red">Note:</span></b> Once you enter your student ID, you'll <b><span style="color:red">NOT</span></b> be able to change it again!</p>
        <form id="attendanceForm">
            <div class="mb-4"><br>
                <label for="studentId" class="block text-gray-700 text-sm font-bold mb-2">Student ID</label>
                <input 
                    type="text" 
                    id="studentId" 
                    name="studentId"
                    placeholder="e.g., 1012023"
                    class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>
            
            <div class="flex items-center justify-center" >
                <button 
                    type="submit" 
                    id="submitButton"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200"
                >
                    Submit Student ID
                </button>
            </div>
        </form>

        <!-- This area will show success or error messages from the server -->
        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <!-- This script handles sending the form data to your Node.js server -->
    <script>
        
        // Get references to the HTML elements we'll be working with.
        const form = document.getElementById('attendanceForm');
        const studentIdInput = document.getElementById('studentId');
        const messageArea = document.getElementById('messageArea');
        const submitButton = document.getElementById('submitButton');

        // Listen for the form's 'submit' event.
        form.addEventListener('submit', async (event) => {
            // 1. Prevent the form from doing its default behavior (reloading the page).
            event.preventDefault();
            // Get the query parameters from the current URL
            const urlParams = new URLSearchParams(window.location.search);

            // Get the value of the 'token' parameter, or default to an empty string if it's not there.
            const token = urlParams.get('token') || '';
            // 2. Get the value from the input field.
            const studentId = studentIdInput.value;

            // 3. Disable the button to prevent multiple submissions while waiting for a response.
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            messageArea.textContent = ''; // Clear any previous messages

            try {
                // 4. Send the data to your server's backend endpoint using the Fetch API.
                const response = fetch(`/api/submit_id`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json' // Tell the server we're sending JSON
                    },
                    body: JSON.stringify({ studentId, token }) // Convert our data to a JSON string
                });

                // 5. Wait for the server's response.
                const result = await response;
                if (result.ok){
                    // Redirect to /student?token=... after successful submission
                    messageArea.textContent = 'Student ID submitted successfully! Redirecting...';
                    messageArea.classList.remove('text-red-500');
                    messageArea.classList.add('text-green-600');
                    setTimeout(() => {
                        window.location.href = `/student?token=${encodeURIComponent(token)}`;
                    }, 2000);
                }
            }catch (error) {
                // 5. If there's an error, show it in the message area.
                messageArea.textContent = `Error: ${error.message}`;
                messageArea.classList.add('text-red-500');
            }
            
        });
    </script>

</body>
</html>
