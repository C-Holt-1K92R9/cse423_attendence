<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        html, body {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12 px-4">

    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Your Account</h1>
        
        <form id="registerForm">
            <div class="mb-4">
                <label for="fullname" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                <input type="text" id="fullname" name="fullname" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your full name" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" name="email" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. something@your.domain" required>
            </div>
            <div class="mb-4">
                <label for="student_id" class="block text-gray-700 text-sm font-bold mb-2">Student ID</label>
                <input type="text" id="student_id" name="student_id" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your student ID" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Create a password (min. 6 characters)" required minlength="6">
                <p class="text-xs text-gray-600 mt-1">Password must be at least 6 characters long</p>
            </div>
            <div class="mb-6">
                <label for="confirmPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Re-enter your password" required>
            </div>
            <label class="flex items-center mb-4 w-full cursor-pointer select-none">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" class="form-checkbox h-5 w-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300" required>
                <span class="ml-2 text-gray-700 text-sm">I agree to the terms and conditions</span>
            </label>
            <div class="flex items-center justify-center">
                <button type="submit" id="registerButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                    Create Account
                </button>
            </div>
        </form>

        <div id="messageArea" class="mt-4 text-center font-medium"></div>

        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">Already have an account? 
                <a href="/" class="text-blue-500 hover:text-blue-700 font-semibold">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const messageArea = document.getElementById('messageArea');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const fullname = form.fullname.value.trim();
            const email = form.email.value.trim();
            let student_id = null;
            
            // Check if email is from student domain
            if (email.split('@')[1] === 'g.bracu.ac.bd') {
                student_id = form.student_id.value.trim();
            }
            
            const password = form.password.value;
            const confirmPassword = form.confirmPassword.value;
            const agreeTerms = form.agreeTerms.checked;

            messageArea.textContent = '';

            // Validation
            if (!agreeTerms) {
                messageArea.textContent = 'Please agree to the terms and conditions';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
                return;
            }

            if (password !== confirmPassword) {
                messageArea.textContent = 'Passwords do not match';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
                return;
            }

            if (password.length < 6) {
                messageArea.textContent = 'Password must be at least 6 characters long';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, student_id, password })
                });

                const result = await response.json();

                if (response.ok) {
                    messageArea.innerHTML = `
                        <div class="mt-4 p-4 rounded-lg bg-green-50 border border-green-200">
                            <p class="text-green-700 font-semibold">Account Created Successfully!</p>
                            <p class="text-green-600 text-sm mt-2">A verification email has been sent to:</p>
                            <p class="text-green-700 font-mono text-sm">${email}</p>
                            <p class="text-green-600 text-sm mt-2">Please click the link in the email to verify your account.</p>
                            <p class="text-green-600 text-xs mt-2">The verification link will expire in 24 hours.</p>
                            <p class="text-green-600 text-xs mt-3">Redirecting to login in 5 seconds...</p>
                        </div>
                    `;
                    messageArea.className = '';
                    setTimeout(() => {
                        window.location.href = '/?message=Account created. Please verify your email and sign in.';
                    }, 5000);
                } else {
                    messageArea.textContent = result.message || 'Registration failed';
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }
            } catch (error) {
                messageArea.textContent = 'Could not connect to the server.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            }
        });
    </script>
</body>
</html>
