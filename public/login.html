<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h1>
        
        <form id="loginForm">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. something@your.domain" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password here" required>
            </div>
            
            <div class="flex items-center justify-center">
                <button type="submit" id="loginButton" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                    Sign In
                </button>
            </div>
        </form>

        <div id="messageArea" class="mt-4 text-center font-medium"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const messageArea = document.getElementById('messageArea');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = form.username.value;
            const password = form.password.value;
            messageArea.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // If login is successful, redirect to the admin page.
                    window.location.href = '/admin';
                } else {
                    messageArea.textContent = result.message;
                    messageArea.className = 'mt-4 text-center font-medium text-red-600';
                }
            } catch (error) {
                messageArea.textContent = 'Could not connect to the server.';
                messageArea.className = 'mt-4 text-center font-medium text-red-600';
            }
        });
    </script>
</body>
</html>
