<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-12 px-4">
    <!-- Logout Button -->
    <div class="absolute top-6 right-8">
        <button type="button"
            id="logoutButton"
            class="flex items-center gap-2 bg-white border border-red-500 text-red-600 hover:bg-red-50 hover:text-red-700 font-semibold py-2 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-300 transition-colors duration-200"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
            </svg>
            Log Out
        </button>
    </div>

    <div class="max-w-2xl mx-auto mt-12">
        <!-- Back Button -->
        <button id="backButton" class="mb-6 flex items-center gap-2 text-blue-600 hover:text-blue-700 font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </button>

        <!-- Profile Card -->
        <div class="bg-white rounded-lg shadow-md p-8">
            <div class="flex items-center mb-8">
                <img id="profilePhoto" src="" alt="Profile Photo" class="w-24 h-24 rounded-full border-4 border-blue-500 object-cover mr-6" referrerpolicy="no-referrer">
                <div>
                    <h1 id="userName" class="text-3xl font-bold text-gray-800"></h1>
                    <p id="userType" class="text-gray-600 text-sm"></p>
                </div>
            </div>

            <!-- Message Area -->
            <div id="messageArea" class="mb-6 text-center font-medium hidden"></div>

            <!-- Profile Form -->
            <form id="profileForm" class="space-y-6">
                <!-- Personal Information Section -->
                <div class="border-b pb-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Personal Information</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="fullname" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                            <input type="text" id="fullname" name="fullname" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                            <input type="email" id="email" name="email" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>
                            <p class="text-xs text-gray-500 mt-1">Email cannot be changed</p>
                        </div>
                    </div>

                    <!-- Student ID (visible only for students) -->
                    <div id="studentIdSection" class="mt-4 hidden">
                        <label for="studentId" class="block text-gray-700 text-sm font-bold mb-2">Student ID</label>
                        <input type="text" id="studentId" name="studentId" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" disabled>
                        <p class="text-xs text-gray-500 mt-1">Student ID cannot be changed</p>
                    </div>
                </div>

                <!-- Change Password Section -->
                <div class="border-b pb-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Change Password</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="currentPassword" class="block text-gray-700 text-sm font-bold mb-2">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <p class="text-xs text-gray-500 mt-1">Leave blank if you don't want to change password</p>
                        </div>
                        <div>
                            <label for="newPassword" class="block text-gray-700 text-sm font-bold mb-2">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                        Save Changes
                    </button>
                    <button type="reset" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors duration-200">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('profileForm');
        const messageArea = document.getElementById('messageArea');
        const logoutButton = document.getElementById('logoutButton');
        const backButton = document.getElementById('backButton');

        // Load user profile
        async function loadProfile() {
            try {
                const response = await fetch('/api/profile');
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                
                const user = await response.json();
                
                // Set profile information
                document.getElementById('userName').textContent = user.Name;
                document.getElementById('userType').textContent = user.type === 0 ? 'Student Account' : 'Faculty Account';
                document.getElementById('fullname').value = user.Name;
                document.getElementById('email').value = user.Email;
                
                if (user.Photo_url) {
                    document.getElementById('profilePhoto').src = user.Photo_url;
                } else {
                    document.getElementById('profilePhoto').src = 'https://via.placeholder.com/96';
                }

                // Show student ID section only for students
                if (user.type === 0 && user.StudentID) {
                    document.getElementById('studentIdSection').classList.remove('hidden');
                    document.getElementById('studentId').value = user.StudentID;
                }

                // Store user type for back button navigation
                window.userType = user.type;
            } catch (error) {
                console.error('Error loading profile:', error);
                window.location.href = '/';
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const fullname = document.getElementById('fullname').value.trim();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            messageArea.classList.add('hidden');

            // Validation
            if (!fullname) {
                showMessage('Full name is required.', 'error');
                return;
            }

            // Password validation if changing password
            if (currentPassword || newPassword || confirmPassword) {
                if (!currentPassword) {
                    showMessage('Current password is required to change password.', 'error');
                    return;
                }
                if (!newPassword || !confirmPassword) {
                    showMessage('Please fill in all password fields.', 'error');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showMessage('New passwords do not match.', 'error');
                    return;
                }
                if (newPassword.length < 6) {
                    showMessage('New password must be at least 6 characters long.', 'error');
                    return;
                }
            }

            try {
                const response = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullname,
                        currentPassword: currentPassword || undefined,
                        newPassword: newPassword || undefined
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Profile updated successfully!', 'success');
                    // Clear password fields
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    showMessage(result.message || 'Failed to update profile.', 'error');
                }
            } catch (error) {
                showMessage('Could not connect to the server.', 'error');
            }
        });

        function showMessage(text, type) {
            messageArea.textContent = text;
            messageArea.classList.remove('hidden');
            messageArea.className = `mb-6 text-center font-medium ${type === 'error' ? 'text-red-600' : 'text-green-600'}`;
        }

        // Logout
        logoutButton.addEventListener('click', async () => {
            await fetch('/api/logout');
            window.location.href = '/';
        });

        // Back button
        backButton.addEventListener('click', () => {
            const redirectUrl = window.userType === 0 ? '/student' : '/admin/dashboard';
            window.location.href = redirectUrl;
        });

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
